<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>坦克大战 Battle City</title>
<style>
  :root {
    --bg: #0b0b0f;
    --panel: #1a1a22;
    --panel-border: #3a3a4a;
    --text: #e8e8f0;
    --accent: #f5c518;
    --accent-2: #4a9eff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: radial-gradient(1200px 700px at 50% -10%, #232330 0%, var(--bg) 60%);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  #wrap {
    display: flex;
    gap: 20px;
    align-items: stretch;
  }
  #game-box {
    background: var(--panel);
    border: 2px solid var(--panel-border);
    border-radius: 12px;
    padding: 14px;
    box-shadow: 0 18px 60px rgba(0,0,0,.5);
  }
  canvas {
    display: block;
    background: #000;
    border-radius: 6px;
    image-rendering: pixelated;
    touch-action: none;
  }
  #sidebar {
    width: 200px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .panel {
    background: var(--panel);
    border: 2px solid var(--panel-border);
    border-radius: 12px;
    padding: 14px 16px;
  }
  .panel h3 {
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 10px;
    border-bottom: 1px solid var(--panel-border);
    padding-bottom: 6px;
  }
  .stat { display: flex; justify-content: space-between; margin: 6px 0; font-size: 14px; }
  .stat b { color: var(--accent-2); font-variant-numeric: tabular-nums; }
  #lives { display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
  .tank-mini { width: 14px; height: 14px; background: var(--accent); border-radius: 2px; }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.72);
    text-align: center;
    gap: 14px;
    z-index: 10;
  }
  #overlay h1 { font-size: 40px; letter-spacing: 6px; color: var(--accent); text-shadow: 0 0 18px rgba(245,197,24,.5); }
  #overlay p { color: #c9c9d6; font-size: 15px; line-height: 1.7; max-width: 440px; }
  #overlay button {
    font-size: 17px;
    padding: 12px 30px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #141414;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 2px;
    transition: transform .08s ease, box-shadow .15s ease;
  }
  #overlay button:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(245,197,24,.35); }
  .keys { display: grid; grid-template-columns: repeat(3, 26px); gap: 4px; justify-content: center; margin-top: 4px; }
  .keys span {
    width: 26px; height: 26px; line-height: 26px;
    background: #2a2a34; border: 1px solid #4a4a5a; border-radius: 5px;
    font-size: 13px; color: #cfcfdd;
  }
  .keys .blank { background: transparent; border: none; }
  #hint { color: #9a9ab0; font-size: 12px; line-height: 1.6; }
  kbd { background:#2a2a34; border:1px solid #4a4a5a; border-radius:4px; padding:1px 6px; font-size:12px; }

  /* ---------- 触屏控制(虚拟摇杆 + 开火按钮) ---------- */
  #game-box { position: relative; }
  #touch-controls {
    display: none;
    position: absolute; inset: 0;
    z-index: 5;
    pointer-events: none;
  }
  #touch-controls > * { pointer-events: auto; }
  #pause-btn {
    position: absolute; top: 12px; right: 12px;
    width: 42px; height: 42px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(26, 26, 34, .72);
    border: 1px solid rgba(255, 255, 255, .25);
    color: #fff; font-size: 18px; line-height: 1;
    cursor: pointer;
  }
  #joy-zone {
    position: absolute; left: 0; bottom: 0;
    width: 55%; height: 62%;
    touch-action: none;
  }
  #joy-base {
    position: absolute; left: 26px; bottom: 26px;
    width: 116px; height: 116px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255, 255, 255, .08);
    border: 2px solid rgba(255, 255, 255, .28);
    box-shadow: 0 0 0 6px rgba(255, 255, 255, .03);
  }
  #joy-knob {
    width: 50px; height: 50px; border-radius: 50%;
    background: rgba(245, 197, 24, .8);
    box-shadow: 0 0 14px rgba(245, 197, 24, .45);
    will-change: transform;
  }
  #fire-btn {
    position: absolute; right: 26px; bottom: 26px;
    width: 88px; height: 88px; border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, .35);
    background: rgba(224, 78, 42, .78);
    color: #fff; font-weight: 700; font-size: 15px; letter-spacing: 1px;
    touch-action: none; user-select: none; -webkit-user-select: none;
    box-shadow: 0 4px 18px rgba(224, 78, 42, .35);
  }
  #fire-btn.active { background: rgba(255, 120, 70, .95); transform: scale(.94); }

  /* ---------- 移动端布局(触屏或窄屏) ---------- */
  @media (pointer: coarse), (max-width: 760px) {
    html, body { height: auto; min-height: 100%; overflow: auto; align-items: flex-start; }
    #wrap { flex-direction: column; align-items: center; gap: 10px; padding: 10px; width: 100%; max-width: 520px; }
    #game-box { width: min(100%, calc(100vh - 130px)); width: min(100%, calc(100dvh - 130px)); padding: 8px; }
    canvas { width: 100%; height: auto; }
    #sidebar { width: 100%; flex-direction: row; gap: 8px; }
    #sidebar .panel { flex: 1; padding: 10px 12px; }
    #sidebar .panel h3 { display: none; }
    #sidebar .stat { display: inline-flex; align-items: baseline; gap: 4px; margin: 0 10px 0 0; font-size: 13px; }
    #lives { display: inline-flex; gap: 4px; margin: 0; }
    #hint { display: none; }
    #overlay h1 { font-size: 28px; letter-spacing: 4px; }
    #overlay p { font-size: 13px; max-width: 88%; }
    #touch-controls { display: block; }
  }
</style>
</head>
<body>
  <div id="wrap">
    <div id="game-box">
      <canvas id="game" width="520" height="520"></canvas>
      <div id="touch-controls">
        <button id="pause-btn" aria-label="暂停">⏸</button>
        <div id="joy-zone"><div id="joy-base"><div id="joy-knob"></div></div></div>
        <button id="fire-btn">开火</button>
      </div>
    </div>
    <div id="sidebar">
      <div class="panel">
        <h3>战况</h3>
        <div class="stat"><span>分数</span><b id="score">0</b></div>
        <div class="stat"><span>关卡</span><b id="level">1</b></div>
        <div class="stat"><span>剩余敌军</span><b id="remain">0</b></div>
        <div class="stat"><span>生命</span></div>
        <div id="lives"></div>
      </div>
      <div class="panel" id="hint">
        操作:<br>
        <div class="keys">
          <span class="blank"></span><span>↑</span><span class="blank"></span>
          <span>←</span><span>↓</span><span>→</span>
          <span class="blank"></span><span class="blank"></span><span class="blank"></span>
        </div>
        或 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动<br>
        <kbd>空格</kbd> 开火 · <kbd>P</kbd> 暂停
      </div>
    </div>
  </div>

  <div id="overlay">
    <h1>坦克大战</h1>
    <p>保卫基地！摧毁所有敌方坦克。每关 20 辆敌军,击毁得分,摧毁基地则游戏结束。</p>
    <button id="startBtn">开始游戏</button>
  </div>

<script>
(() => {
  "use strict";

  // ---------- 基础常量 ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const COLS = 13, ROWS = 13, TILE = 40;
  const W = COLS * TILE, H = ROWS * TILE;

  // 墙类型
  const EMPTY = 0, BRICK = 1, STEEL = 2, WATER = 3, BASE = 4;

  // 方向 (dx, dy, 角度)
  const DIRS = {
    up:    { dx: 0, dy: -1, angle: 0 },
    right: { dx: 1, dy: 0,  angle: Math.PI / 2 },
    down:  { dx: 0, dy: 1,  angle: Math.PI },
    left:  { dx: -1, dy: 0, angle: -Math.PI / 2 },
  };
  const DIR_KEYS = Object.keys(DIRS); // up, right, down, left

  const PLAYER_SPEED = 140;      // 像素/秒
  const ENEMY_SPEED = 90;
  const BULLET_SPEED = 320;
  const ENEMY_PER_LEVEL = 20;
  const MAX_ENEMIES_ON_FIELD = 4;

  // ---------- 状态 ----------
  let grid = buildMap(1);  // 2D 数组,存墙类型(初始即生成地图,避免菜单态渲染空数组崩溃)
  let player = null;
  let bullets = [];
  let enemies = [];
  let effects = [];        // 爆炸粒子
  let score = 0, level = 1, lives = 3;
  let enemiesToSpawn = 0, totalSpawned = 0;
  let spawnTimer = 0;
  let gameState = "menu";  // menu | playing | paused | over | win | levelclear
  let lastTime = 0;
  let keys = {};
  let virtual = { dir: null, fire: false };   // 触屏虚拟输入(摇杆/开火)
  let baseAlive = true;

  // 音频
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.05) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.value = vol;
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + dur);
    } catch (e) {}
  }
  const sfx = {
    shoot: () => beep(520, 0.06, "square", 0.04),
    hitWall: () => beep(180, 0.08, "square", 0.04),
    boom: () => beep(90, 0.25, "sawtooth", 0.07),
    base: () => { beep(220, 0.4, "sawtooth", 0.09); beep(110, 0.6, "sawtooth", 0.08); },
  };

  // ---------- 地图 ----------
  function buildMap(lv) {
    const m = [];
    for (let r = 0; r < ROWS; r++) {
      m.push(new Array(COLS).fill(EMPTY));
    }
    // 基地(鹰)占 2x2,底部中央
    m[ROWS - 2][6] = BASE; m[ROWS - 2][7] = BASE;
    m[ROWS - 1][6] = BASE; m[ROWS - 1][7] = BASE;
    // 基地周围砖墙
    const brick = (r, c) => { if (m[r][c] === EMPTY) m[r][c] = BRICK; };
    for (let c = 5; c <= 8; c++) { brick(ROWS - 3, c); }
    brick(ROWS - 2, 5); brick(ROWS - 2, 8);
    brick(ROWS - 1, 5); brick(ROWS - 1, 8);

    // 若干钢墙
    const steel = (r, c) => { m[r][c] = STEEL; };
    steel(0, 3); steel(0, 9);
    steel(3, 0); steel(3, 12);
    steel(6, 3); steel(6, 9);

    // 砖墙阵(随关卡增加难度)
    const bricks = [
      [2,2],[2,3],[2,4],[2,8],[2,9],[2,10],
      [4,2],[4,4],[4,6],[4,8],[4,10],
      [7,4],[7,5],[7,7],[7,8],
      [9,2],[9,3],[9,5],[9,7],[9,9],[9,10],
      [10,5],[10,7],
    ];
    for (const [r, c] of bricks) {
      if (m[r][c] === EMPTY) m[r][c] = BRICK;
    }
    if (lv >= 2) {
      // 更密集
      const extra = [[5,3],[5,9],[8,1],[8,11],[11,2],[11,10],[1,6]];
      for (const [r, c] of extra) if (m[r][c] === EMPTY) m[r][c] = BRICK;
    }
    if (lv >= 3) {
      const extra = [[1,2],[1,10],[3,4],[3,8],[8,4],[8,8],[10,6]];
      for (const [r, c] of extra) if (m[r][c] === EMPTY) m[r][c] = STEEL;
    }
    // 水(不可通行,坦克不能进入)
    if (lv >= 2) {
      const water = [[6,0],[6,1],[6,11],[6,12]];
      for (const [r, c] of water) if (m[r][c] === EMPTY) m[r][c] = WATER;
    }
    return m;
  }

  // ---------- 实体 ----------
  function makeTank(x, y, dir, opts = {}) {
    return {
      x, y, dir,               // x,y 为左上角像素坐标
      w: TILE - 2, h: TILE - 2,
      speed: opts.speed || PLAYER_SPEED,
      isPlayer: !!opts.isPlayer,
      cooldown: 0,
      moveTimer: 0,
      color: opts.color || "#f5c518",
      spawnProtect: 1.5,       // 出生保护(无敌)
      alive: true,
    };
  }

  function makeBullet(x, y, dir, owner) {
    return { x, y, dir, owner, fromPlayer: owner.isPlayer, alive: true, w: 6, h: 6 };
  }

  // ---------- 碰撞检测 ----------
  function rectHits(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x &&
           a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function tileAt(c, r) {
    if (c < 0 || r < 0 || c >= COLS || r >= ROWS) return STEEL; // 边界视为钢墙
    return grid[r][c];
  }

  function tilesFor(rect) {
    // 返回该矩形覆盖到的格子坐标集合
    const c0 = Math.floor(rect.x / TILE), c1 = Math.floor((rect.x + rect.w - 0.01) / TILE);
    const r0 = Math.floor(rect.y / TILE), r1 = Math.floor((rect.y + rect.h - 0.01) / TILE);
    const out = [];
    for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) out.push([c, r]);
    return out;
  }

  function isBlocked(rect, ignoreBase = false) {
    for (const [c, r] of tilesFor(rect)) {
      const t = tileAt(c, r);
      if (t === BRICK || t === STEEL || t === WATER) return true;
      if (t === BASE && !ignoreBase) return true;
    }
    return false;
  }

  function tankCollides(rect, self) {
    const tanks = [];
    if (player && player !== self) tanks.push(player);
    for (const e of enemies) if (e !== self) tanks.push(e);
    return tanks.some(t => t.alive && rectHits(rect, t));
  }

  function moveTank(tank, dir) {
    tank.dir = dir;
    const d = DIRS[dir];
    // 逐像素移动以保证贴合墙壁
    for (let step = 0; step < 2; step++) {
      const nx = tank.x + d.dx;
      const ny = tank.y + d.dy;
      const test = { x: nx, y: ny, w: tank.w, h: tank.h };
      if (nx < 0 || ny < 0 || nx + tank.w > W || ny + tank.h > H) break;
      if (isBlocked(test)) break;
      if (tankCollides(test, tank)) break;
      tank.x = nx; tank.y = ny;
    }
  }

  // 让坦克对齐到网格中心,方便转向
  function alignTank(tank, dir) {
    const d = DIRS[dir];
    if (d.dx !== 0) { // 水平移动,对齐 y
      const row = Math.round((tank.y + tank.h / 2) / TILE - 0.5);
      const target = row * TILE + 1;
      if (Math.abs(tank.y - target) <= 2) tank.y = target;
    } else { // 垂直移动,对齐 x
      const col = Math.round((tank.x + tank.w / 2) / TILE - 0.5);
      const target = col * TILE + 1;
      if (Math.abs(tank.x - target) <= 2) tank.x = target;
    }
  }

  // ---------- 开火 ----------
  function fire(tank) {
    if (tank.cooldown > 0) return;
    tank.cooldown = 0.3;
    const d = DIRS[tank.dir];
    const cx = tank.x + tank.w / 2;
    const cy = tank.y + tank.h / 2;
    bullets.push(makeBullet(
      cx - 3 + d.dx * (tank.w / 2),
      cy - 3 + d.dy * (tank.h / 2),
      tank.dir, tank
    ));
    sfx.shoot();
  }

  // ---------- 子弹逻辑 ----------
  function updateBullets(dt) {
    for (const b of bullets) {
      if (!b.alive) continue;
      const d = DIRS[b.dir];
      b.x += d.dx * BULLET_SPEED * dt;
      b.y += d.dy * BULLET_SPEED * dt;

      // 出界
      if (b.x < 0 || b.y < 0 || b.x + b.w > W || b.y + b.h > H) { b.alive = false; continue; }

      // 命中墙
      let hitWall = false;
      for (const [c, r] of tilesFor(b)) {
        const t = tileAt(c, r);
        if (t === BRICK) {
          grid[r][c] = EMPTY;
          hitWall = true;
          addEffect(c * TILE + TILE / 2, r * TILE + TILE / 2, "#c96b2e");
        } else if (t === STEEL) {
          hitWall = true;
          addEffect(b.x, b.y, "#9aa0b0", 4);
        } else if (t === WATER) {
          hitWall = true;
          break;
        } else if (t === BASE) {
          destroyBase();
          b.alive = false;
          hitWall = true;
          break;
        }
      }
      if (hitWall) { b.alive = false; sfx.hitWall(); continue; }

      // 命中坦克
      if (!b.fromPlayer) {
        if (player && player.alive && rectHits(b, player)) {
          hitPlayer();
          b.alive = false; continue;
        }
      } else {
        for (const e of enemies) {
          if (e.alive && rectHits(b, e)) {
            e.alive = false;
            b.alive = false;
            score += 100;
            addEffect(e.x + e.w / 2, e.y + e.h / 2, "#ff6b35", 16);
            sfx.boom();
            updateHud();
            break;
          }
        }
      }
    }
    bullets = bullets.filter(b => b.alive);
  }

  // ---------- 玩家 ----------
  function hitPlayer() {
    if (player.spawnProtect > 0) return;
    player.alive = false;
    addEffect(player.x + player.w / 2, player.y + player.h / 2, "#f5c518", 18);
    sfx.boom();
    lives--;
    updateHud();
    if (lives <= 0) {
      gameOver();
    } else {
      respawnPlayer();
    }
  }

  function respawnPlayer() {
    player = makeTank(4 * TILE + 1, (ROWS - 1) * TILE + 1, "up", { isPlayer: true });
  }

  function destroyBase() {
    if (!baseAlive) return;
    baseAlive = false;
    // 基地瓦片显示为残骸
    sfx.base();
    addEffect(6.5 * TILE, (ROWS - 1.5) * TILE, "#ff3344", 40);
    gameOver();
  }

  // ---------- 敌人 ----------
  function spawnEnemy() {
    if (enemiesToSpawn <= 0 || enemies.length >= MAX_ENEMIES_ON_FIELD) return;
    const spots = [0, 6, 12].map(c => ({ x: c * TILE + 1, y: 1 }));
    // 随机选一个没有被占用的出生点
    const free = spots.filter(s => !tankCollides({ x: s.x, y: s.y, w: TILE - 2, h: TILE - 2 }, null));
    if (free.length === 0) return;
    const spot = free[Math.floor(Math.random() * free.length)];
    const colors = ["#ff6b35", "#ff8c5a", "#e04e2a", "#ffa07a"];
    const e = makeTank(spot.x, spot.y, "down", {
      speed: ENEMY_SPEED,
      color: colors[Math.floor(Math.random() * colors.length)],
    });
    enemies.push(e);
    enemiesToSpawn--;
    totalSpawned++;
    addEffect(e.x + e.w / 2, e.y + e.h / 2, "#ffffff", 10);
    updateHud();
  }

  function updateEnemies(dt) {
    for (const e of enemies) {
      if (!e.alive) continue;
      e.cooldown -= dt;
      e.moveTimer -= dt;

      if (e.spawnProtect > 0) e.spawnProtect -= dt;

      // AI:定期换方向
      if (e.moveTimer <= 0) {
        // 40% 概率追踪玩家,其余随机
        if (player && player.alive && Math.random() < 0.4) {
          const dx = player.x - e.x, dy = player.y - e.y;
          if (Math.abs(dx) > Math.abs(dy)) {
            e.dir = dx > 0 ? "right" : "left";
          } else {
            e.dir = dy > 0 ? "down" : "up";
          }
        } else {
          e.dir = DIR_KEYS[Math.floor(Math.random() * 4)];
        }
        e.moveTimer = 0.8 + Math.random() * 1.6;
      }

      alignTank(e, e.dir);
      const before = { x: e.x, y: e.y };
      const d = DIRS[e.dir];
      e.x += d.dx * e.speed * dt;
      e.y += d.dy * e.speed * dt;

      // 撞墙/出界/撞其他坦克 → 回退并换方向
      if (e.x < 0 || e.y < 0 || e.x + e.w > W || e.y + e.h > H ||
          isBlocked(e) || tankCollides(e, e)) {
        e.x = before.x; e.y = before.y;
        e.dir = DIR_KEYS[Math.floor(Math.random() * 4)];
        e.moveTimer = 0.4 + Math.random() * 0.8;
      }

      // 开火
      if (e.cooldown <= 0 && Math.random() < 0.02) {
        fire(e);
      }
    }
    enemies = enemies.filter(e => e.alive);

    // 出生计时
    spawnTimer -= dt;
    if (spawnTimer <= 0 && enemiesToSpawn > 0 && enemies.length < MAX_ENEMIES_ON_FIELD) {
      spawnEnemy();
      spawnTimer = 1.2;
    }

    // 关卡通关判定
    if (enemiesToSpawn <= 0 && enemies.length === 0 && gameState === "playing") {
      levelClear();
    }
  }

  // ---------- 特效 ----------
  function addEffect(x, y, color, count = 10) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 30 + Math.random() * 90;
      effects.push({
        x, y,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 0.4 + Math.random() * 0.3, t: 0,
        color,
      });
    }
  }

  function updateEffects(dt) {
    for (const p of effects) {
      p.t += dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 0.92; p.vy *= 0.92;
    }
    effects = effects.filter(p => p.t < p.life);
  }

  // ---------- 流程控制 ----------
  function startLevel(lv) {
    grid = buildMap(lv);
    baseAlive = true;
    bullets = []; enemies = []; effects = [];
    enemiesToSpawn = ENEMY_PER_LEVEL;
    totalSpawned = 0;
    spawnTimer = 1.0;
    respawnPlayer();
    updateHud();
  }

  function levelClear() {
    gameState = "levelclear";
    sfx.boom();
    setTimeout(() => {
      if (gameState !== "levelclear") return;
      level++;
      startLevel(level);
      gameState = "playing";
    }, 1800);
  }

  function gameOver() {
    if (gameState !== "playing") return;
    gameState = "over";
    showOverlay("游戏结束", `得分:${score} · 到达关卡 ${level}`);
  }

  function showOverlay(title, sub, btnText = "再来一局") {
    const ov = document.getElementById("overlay");
    ov.style.display = "flex";
    ov.querySelector("h1").textContent = title;
    ov.querySelector("p").textContent = sub;
    document.getElementById("startBtn").textContent = btnText;
  }

  function updateHud() {
    document.getElementById("score").textContent = score;
    document.getElementById("level").textContent = level;
    document.getElementById("remain").textContent = enemiesToSpawn + enemies.length;
    const livesEl = document.getElementById("lives");
    livesEl.innerHTML = "";
    for (let i = 0; i < Math.max(0, lives); i++) {
      const s = document.createElement("div");
      s.className = "tank-mini";
      livesEl.appendChild(s);
    }
  }

  // ---------- 渲染 ----------
  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#0a0a0a";
    ctx.fillRect(0, 0, W, H);

    // 网格线(淡)
    ctx.strokeStyle = "rgba(255,255,255,0.03)";
    for (let i = 1; i < COLS; i++) {
      ctx.beginPath(); ctx.moveTo(i * TILE, 0); ctx.lineTo(i * TILE, H); ctx.stroke();
    }
    for (let i = 1; i < ROWS; i++) {
      ctx.beginPath(); ctx.moveTo(0, i * TILE); ctx.lineTo(W, i * TILE); ctx.stroke();
    }

    // 地图
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const t = grid[r][c];
        const x = c * TILE, y = r * TILE;
        if (t === BRICK) {
          drawBrick(x, y);
        } else if (t === STEEL) {
          drawSteel(x, y);
        } else if (t === WATER) {
          drawWater(x, y);
        } else if (t === BASE) {
          drawBase(x, y, baseAlive);
        }
      }
    }

    // 特效(在坦克之下)
    for (const p of effects) {
      const a = 1 - p.t / p.life;
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;

    // 敌人
    for (const e of enemies) if (e.alive) drawTank(e);

    // 玩家
    if (player && player.alive) {
      if (player.spawnProtect > 0 && Math.floor(Date.now() / 100) % 2 === 0) {
        ctx.globalAlpha = 0.4;
      }
      drawTank(player);
      ctx.globalAlpha = 1;
    }

    // 子弹
    ctx.fillStyle = "#ffffff";
    for (const b of bullets) {
      ctx.fillRect(b.x, b.y, b.w, b.h);
    }
  }

  function drawBrick(x, y) {
    ctx.fillStyle = "#8a4a24";
    ctx.fillRect(x, y, TILE, TILE);
    ctx.fillStyle = "#a85e30";
    ctx.fillRect(x, y, TILE - 2, TILE - 2);
    // 砖纹
    ctx.strokeStyle = "#6b3718";
    ctx.lineWidth = 1;
    const hh = TILE / 2;
    ctx.beginPath();
    ctx.moveTo(x, y + hh); ctx.lineTo(x + TILE, y + hh);
    ctx.moveTo(x + TILE / 2, y); ctx.lineTo(x + TILE / 2, y + hh);
    ctx.moveTo(x + TILE / 4, y + hh); ctx.lineTo(x + TILE / 4, y + TILE);
    ctx.moveTo(x + TILE * 3 / 4, y + hh); ctx.lineTo(x + TILE * 3 / 4, y + TILE);
    ctx.stroke();
  }

  function drawSteel(x, y) {
    ctx.fillStyle = "#8f9aa8";
    ctx.fillRect(x, y, TILE, TILE);
    ctx.fillStyle = "#c3cdd8";
    ctx.fillRect(x + 3, y + 3, TILE - 6, TILE - 6);
    ctx.fillStyle = "#6c7684";
    ctx.fillRect(x + 8, y + 8, TILE - 16, TILE - 16);
  }

  function drawWater(x, y) {
    ctx.fillStyle = "#1c4a6e";
    ctx.fillRect(x, y, TILE, TILE);
    ctx.fillStyle = "#2f78b0";
    const t = Date.now() / 400;
    for (let i = 0; i < 3; i++) {
      const yy = y + 6 + i * 12;
      const off = Math.sin(t + i) * 4;
      ctx.fillRect(x + 4 + off, yy, TILE - 8, 3);
    }
  }

  function drawBase(x, y, alive) {
    // 鹰形基地(绘制在 2x2 区域中心)
    if (alive) {
      const cx = x + TILE, cy = y + TILE;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.fillStyle = "#e8b23a";
      ctx.fillRect(-16, -8, 32, 16);        // 身体
      ctx.fillStyle = "#d99a24";
      ctx.fillRect(-14, -12, 6, 20);        // 左翼
      ctx.fillRect(8, -12, 6, 20);          // 右翼
      ctx.fillStyle = "#7a4a12";
      ctx.fillRect(-6, -6, 12, 12);         // 中心
      ctx.fillStyle = "#e8b23a";
      ctx.beginPath();
      ctx.moveTo(-8, -12); ctx.lineTo(-2, -4); ctx.lineTo(-14, -4); ctx.closePath();
      ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.fillRect(-3, -2, 3, 3);           // 眼睛
      ctx.fillRect(1, -2, 3, 3);
      ctx.restore();
    } else {
      // 残骸
      ctx.fillStyle = "#333";
      ctx.fillRect(x + 6, y + 6, TILE * 2 - 12, TILE * 2 - 12);
      ctx.strokeStyle = "#ff3344";
      ctx.strokeRect(x + 6, y + 6, TILE * 2 - 12, TILE * 2 - 12);
    }
  }

  function drawTank(t) {
    ctx.save();
    ctx.translate(t.x + t.w / 2, t.y + t.h / 2);
    ctx.rotate(DIRS[t.dir].angle);
    const w = t.w, h = t.h;

    // 履带
    ctx.fillStyle = "#2a2a2a";
    ctx.fillRect(-w / 2, -h / 2, 7, h);
    ctx.fillRect(w / 2 - 7, -h / 2, 7, h);
    // 履带纹理
    ctx.fillStyle = "#444";
    for (let i = 0; i < h / 6; i++) {
      ctx.fillRect(-w / 2, -h / 2 + i * 6, 7, 3);
      ctx.fillRect(w / 2 - 7, -h / 2 + i * 6, 7, 3);
    }
    // 车身
    ctx.fillStyle = t.color;
    ctx.fillRect(-w / 2 + 7, -h / 2 + 3, w - 14, h - 6);
    // 炮塔
    ctx.fillStyle = t.isPlayer ? "#d9a020" : "#c05020";
    ctx.fillRect(-7, -7, 14, 14);
    // 炮管
    ctx.fillStyle = "#1a1a1a";
    ctx.fillRect(-3, -h / 2 - 4, 6, 12);
    ctx.restore();
  }

  // ---------- 主循环 ----------
  function loop(ts) {
    const dt = Math.min((ts - lastTime) / 1000, 0.05);
    lastTime = ts;

    if (gameState === "playing") {
      // 玩家输入
      if (player && player.alive) {
        const before = { x: player.x, y: player.y };
        let dir = virtual.dir;
        if (!dir) {
          if (keys["ArrowUp"] || keys["w"] || keys["W"]) dir = "up";
          else if (keys["ArrowDown"] || keys["s"] || keys["S"]) dir = "down";
          else if (keys["ArrowLeft"] || keys["a"] || keys["A"]) dir = "left";
          else if (keys["ArrowRight"] || keys["d"] || keys["D"]) dir = "right";
        }

        if (dir) {
          player.dir = dir;
          const d = DIRS[dir];
          player.x += d.dx * player.speed * dt;
          player.y += d.dy * player.speed * dt;
          if (player.x < 0 || player.y < 0 || player.x + player.w > W || player.y + player.h > H ||
              isBlocked(player) || tankCollides(player, player)) {
            player.x = before.x; player.y = before.y;
          }
          alignTank(player, dir);
        }
        if (keys[" "] || keys["Spacebar"] || virtual.fire) fire(player);
        player.cooldown -= dt;
        if (player.spawnProtect > 0) player.spawnProtect -= dt;
      }

      updateEnemies(dt);
      updateBullets(dt);
      updateEffects(dt);
    }

    draw();
    requestAnimationFrame(loop);
  }

  // ---------- 输入 ----------
  function togglePause() {
    if (gameState === "playing") { gameState = "paused"; showOverlay("已暂停", "点击“继续游戏”或按 P 继续", "继续游戏"); }
    else if (gameState === "paused") { hideOverlay(); gameState = "playing"; }
  }
  window.addEventListener("keydown", (e) => {
    if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key)) {
      e.preventDefault();
    }
    keys[e.key] = true;
    if (e.key === "p" || e.key === "P") togglePause();
  });
  window.addEventListener("keyup", (e) => { keys[e.key] = false; });

  function hideOverlay() {
    document.getElementById("overlay").style.display = "none";
  }

  document.getElementById("startBtn").addEventListener("click", () => {
    if (gameState === "paused") { hideOverlay(); gameState = "playing"; return; }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    score = 0; level = 1; lives = 3;
    hideOverlay();
    startLevel(1);
    gameState = "playing";
  });

  // ---------- 触屏控制(虚拟摇杆 + 开火) ----------
  const joyZone = document.getElementById("joy-zone");
  const joyBase = document.getElementById("joy-base");
  const joyKnob = document.getElementById("joy-knob");
  const fireBtn = document.getElementById("fire-btn");
  const pauseBtn = document.getElementById("pause-btn");

  let joyId = null;          // 当前摇杆指针 id
  const JOY_RADIUS = 30;     // 摇杆最大位移(px)
  const JOY_DEADZONE = 10;   // 死区,小于该距离视为未推动

  function joyDirFrom(dx, dy) {
    if (Math.hypot(dx, dy) < JOY_DEADZONE) return null;
    if (Math.abs(dx) > Math.abs(dy)) return dx > 0 ? "right" : "left";
    return dy > 0 ? "down" : "up";
  }

  function updateJoy(e) {
    const r = joyBase.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    let dx = e.clientX - cx, dy = e.clientY - cy;
    const dist = Math.hypot(dx, dy);
    if (dist > JOY_RADIUS) { dx = dx / dist * JOY_RADIUS; dy = dy / dist * JOY_RADIUS; }
    joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
    virtual.dir = joyDirFrom(dx, dy);
  }

  function endJoy(e) {
    if (e && e.pointerId !== joyId) return;
    joyId = null;
    joyKnob.style.transform = "translate(0, 0)";
    virtual.dir = null;
  }

  joyZone.addEventListener("pointerdown", (e) => {
    if (joyId !== null) return;
    joyId = e.pointerId;
    joyZone.setPointerCapture(e.pointerId);
    updateJoy(e);
    e.preventDefault();
  });
  joyZone.addEventListener("pointermove", (e) => {
    if (e.pointerId !== joyId) return;
    updateJoy(e);
    e.preventDefault();
  });
  joyZone.addEventListener("pointerup", endJoy);
  joyZone.addEventListener("pointercancel", endJoy);

  function setFire(on) {
    virtual.fire = on;
    fireBtn.classList.toggle("active", on);
  }
  fireBtn.addEventListener("pointerdown", (e) => {
    fireBtn.setPointerCapture(e.pointerId);
    setFire(true);
    e.preventDefault();
  });
  fireBtn.addEventListener("pointerup", () => setFire(false));
  fireBtn.addEventListener("pointercancel", () => setFire(false));

  pauseBtn.addEventListener("click", (e) => {
    e.preventDefault();
    togglePause();
  });

  // ---------- 启动 ----------
  updateHud();
  lastTime = performance.now();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
